name: Rebuild housing dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  housing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Reproduce dashboard data and verify committed output
        run: python scripts/build_housing_dashboard.py --check
      - name: Test units, dates, and duplicate handling
        run: python -m pytest tests/test_housing_dashboard.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: housing-dashboard
          path: docs/
